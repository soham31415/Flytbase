<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlytBase CRM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%230b6bcb%22/%3E%3Cpath d=%22M4 11l4-6 4 6%22 stroke=%22white%22 stroke-width=%221.6%22 fill=%22none%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>
  <aside class="nav">
    <a class="nav-brand" href="#/"><span class="brand-mark">F</span><span class="brand-text">FlytBase CRM</span></a>
    <nav class="nav-links">
      <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="#/accounts" data-nav="accounts"><svg viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M8 8h3M8 12h3M8 16h3"/></svg><span>Accounts</span></a>
      <a href="#/deals" data-nav="deals"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/></svg><span>Deals</span></a>
      <a href="#/contacts" data-nav="contacts"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Contacts</span></a>
      <a href="#/activities" data-nav="activities"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Activities</span></a>
      <div class="nav-sep"></div>
      <a href="#/insights" data-nav="insights"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg><span>Insights</span></a>
    </nav>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <span class="top-date" id="asof"></span>
        <span class="top-sync" id="sync"></span>
        <button class="icon-btn" id="sync-btn" title="Sync">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16m0 4v-4h-4"/></svg>
        </button>
        <button class="icon-btn" id="theme-btn" title="Toggle dark mode">
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span class="avatar" title="You (CSM)">You</span>
      </div>
    </header>
    <main id="main" class="main"><div class="loading">Loading…</div></main>
  </div>

  <div id="scrim" class="scrim"></div>
  <aside id="panel" class="panel-drawer" aria-hidden="true">
    <div class="panel-head">
      <button class="icon-btn" id="panel-back" title="Back" hidden><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="panel-title-wrap"><div class="panel-kicker" id="panel-kicker"></div><div class="panel-title" id="panel-title"></div></div>
      <button class="icon-btn" id="panel-close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>
  <div id="toast" class="toast"></div>

  <script src="/static/app.js?v={{ v }}"></script>
</body>
</html>
