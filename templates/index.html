<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questathon CRM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1l7 7-7 7-7-7z%22 fill=%22%232f5bea%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="logo">◆</span> Questathon CRM</a>
    <div class="topbar-meta">
      <span id="asof" class="pill" title="In-game date">…</span>
      <span id="sync" class="muted">…</span>
      <button id="sync-btn" class="btn btn-ghost" title="Re-read the local snapshots and rebuild">Sync</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <a class="nav-item" href="#/" data-nav="portfolio">Portfolio</a>
      <div class="nav-label">Accounts</div>
      <div id="account-nav"></div>
    </nav>

    <main id="main" class="main">
      <div class="loading">Loading…</div>
    </main>
  </div>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <div class="drawer-kind" id="drawer-kind"></div>
        <div class="drawer-title mono" id="drawer-title"></div>
      </div>
      <button class="btn btn-ghost" id="drawer-close" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div id="toast" class="toast"></div>

  <script src="/static/app.js?v={{ v }}"></script>
</body>
</html>
